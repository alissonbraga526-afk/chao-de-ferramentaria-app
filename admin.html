<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Admin | Chão de Ferramentaria</title></head><body>
<header class="topbar"><div class="brand">CHÃO DE <span>FERRAMENTARIA</span></div><small>Painel administrativo seguro</small></header>
<main id="loginView" class="section"><div class="card"><h1>Entrar no painel</h1><form id="loginForm"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button class="primary-btn" type="submit">Entrar</button><p id="loginStatus" class="muted"></p></form></div></main>
<main id="adminView" class="admin-main" style="display:none"><section class="section"><div class="section-head"><h1>Painel administrativo</h1><button id="logoutBtn" class="secondary-btn">Sair</button></div><div class="admin-tabs"><button class="tab active" data-type="tecnico">Técnico</button><button class="tab" data-type="eventos">Eventos</button><button class="tab" data-type="episodios">Episódios</button><button class="tab" data-type="parceiros">Parceiros</button></div><form id="contentForm" class="card form-card"><label>Título<input id="titulo" required></label><label>Descrição<textarea id="descricao" rows="5" required></textarea></label><label>Link opcional<input id="link" type="url"></label><label>Data opcional<input id="data" type="date"></label><button class="primary-btn" type="submit">Publicar</button><p id="status" class="muted"></p></form></section><section class="section"><h2>Conteúdos publicados</h2><div id="admin-list" class="cards"></div></section></main>
<script src="config.js"></script><script src="admin.js"></script></body></html>
