<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b5da8">
  <link rel="stylesheet" href="style.css">
  <title>Admin | Chão de Ferramentaria</title>
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">CHÃO DE <span>FERRAMENTARIA</span></div>
    <small>Painel administrativo</small>
  </div>
</header>

<main class="admin-main">
  <section class="section">
    <h1>Painel administrativo</h1>
    <p class="muted">Adicione e remova conteúdos sem editar o código do app.</p>

    <div class="admin-tabs">
      <button class="tab active" data-type="tecnico">Técnico</button>
      <button class="tab" data-type="eventos">Eventos</button>
      <button class="tab" data-type="episodios">Episódios</button>
      <button class="tab" data-type="parceiros">Parceiros</button>
    </div>

    <form id="contentForm" class="card form-card">
      <input type="hidden" id="tipo" value="tecnico">
      <label>Título<input id="titulo" required maxlength="120"></label>
      <label>Descrição<textarea id="descricao" rows="5" required></textarea></label>
      <label>Link opcional<input id="link" type="url" placeholder="https://..."></label>
      <label>Data opcional<input id="data" type="date"></label>
      <button class="primary-btn" type="submit">Publicar</button>
      <p id="status" class="muted"></p>
    </form>
  </section>

  <section class="section">
    <h2>Conteúdos publicados</h2>
    <div id="admin-list" class="cards"></div>
  </section>

  <section class="section">
    <a class="secondary-btn" href="index.html">Voltar ao app</a>
  </section>
</main>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
