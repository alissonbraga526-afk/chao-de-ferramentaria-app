<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Admin | Chão de Ferramentaria</title></head><body>
<header class="topbar"><div class="brand">CHÃO DE <span>FERRAMENTARIA</span></div><small>Painel administrativo seguro</small></header>
<main id="loginView" class="admin-shell"><section class="admin-card"><h1>Entrar no painel</h1><form id="loginForm" class="admin-form"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" required><button class="primary-btn full" type="submit">Entrar</button><p id="loginStatus" class="muted"></p></form></section></main>
<main id="adminView" class="admin-shell" style="display:none"><section class="admin-header-card"><div><h1>Painel administrativo</h1><p class="muted">Publique diretamente pelo celular.</p></div><button id="logoutBtn" class="secondary-btn">Sair</button></section>
<section class="admin-tabs-wrap"><div class="admin-tabs">
<button class="tab active" data-type="tecnico">Técnico</button><button class="tab" data-type="eventos">Eventos</button><button class="tab" data-type="episodios">Episódios</button><button class="tab" data-type="parceiros">Patrocinadores</button><button class="tab" data-type="empresas">Empresas</button><button class="tab" data-type="vagas">Vagas</button>
</div></section>
<section class="admin-card"><form id="contentForm" class="admin-form"><label>Título</label><input id="titulo" required maxlength="120"><label>Descrição</label><textarea id="descricao" rows="6" required></textarea><label>Link opcional</label><input id="link" type="url" placeholder="https://..."><label>Data opcional</label><input id="data" type="date"><button class="primary-btn full" type="submit">Publicar</button><p id="status" class="muted"></p></form></section>
<section><h2>Conteúdos publicados</h2><div id="admin-list" class="cards"></div></section></main>
<script src="config.js"></script><script src="admin.js"></script></body></html>
